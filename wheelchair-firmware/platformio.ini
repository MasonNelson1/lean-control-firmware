; LEAN Wheelchair control firmware — PlatformIO project
; Build:   pio run
; Upload:  pio run -t upload
; Monitor: pio device monitor
; Tests:   ./run-tests.sh   (host-side; no hardware needed)
;
; The old can_test / simple bench programs were removed from src/; recover
; them from git history (e.g. `git log -- src/can_motor_test.cpp`) if needed.

[platformio]
default_envs = teensy41

[env]
platform = teensy
board = teensy41
framework = arduino
upload_protocol = teensy-cli
monitor_speed = 115200
; Show what you type in the monitor and send a newline on Enter
; (SIM_MODE commands like "800,400,500,500" need the newline).
monitor_echo = yes
monitor_eol = LF

; Main lean-control firmware
[env:teensy41]
lib_deps =
    arduinogetstarted/ezButton@^1.0.6
    https://github.com/bakercp/PacketSerial.git
monitor_filters = log2file
