[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
build_flags = -I../shared/include
monitor_speed = 115200
upload_speed = 921600


lib_deps =
    ArduinoGetStarted/ezButton
    bxparks/AceTMI
    bxparks/AceSegment
    https://github.com/bakercp/PacketSerial.git
