; LEAN Wheelchair control firmware — PlatformIO project
; Build:   pio run                      (main firmware only)
; Upload:  pio run -t upload
; Monitor: pio device monitor
;
; CAN motor bench test (separate program, see HANDOFF.md section 8):
;   pio run -e can_test
;   pio run -e can_test -t upload

[platformio]
default_envs = teensy41

[env]
platform = teensy
board = teensy41
framework = arduino
monitor_speed = 115200
; Show what you type in the monitor and send a newline on Enter
; (SIM_MODE commands like "800,400,500,500" need the newline).
monitor_echo = yes
monitor_eol = LF

; Main lean-control firmware
[env:teensy41]
build_src_filter = +<*> -<can_motor_test.cpp>

; Two-sensor -> one-VESC CAN bench test
[env:can_test]
build_src_filter = -<*> +<can_motor_test.cpp>
