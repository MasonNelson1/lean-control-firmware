name: Debug viewer Pages

on:
  push:
    branches: [main]
    paths:
      - 'wheelchair-firmware/debugViewer/**'
      - '.github/workflows/debug-viewer-pages.yml'
  pull_request:
    paths:
      - 'wheelchair-firmware/debugViewer/**'
      - '.github/workflows/debug-viewer-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: debug-viewer-pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: wheelchair-firmware/debugViewer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: wheelchair-firmware/debugViewer/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install -r requirements.txt
      - run: npm test
      - run: python -B -m unittest discover -s tests
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: wheelchair-firmware/debugViewer/dist
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish dashboard
        id: deployment
        uses: actions/deploy-pages@v4
